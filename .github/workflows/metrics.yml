name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # GitHub Highlights (replaces the broken achievements plugin)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: GoneSeeder
          filename: metrics.highlights.svg
          committer_branch: metrics
          base: activity, community, repositories
          base_indepth: no

      # Contribution Activity
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: GoneSeeder
          filename: metrics.isocalendar.svg
          committer_branch: metrics
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
